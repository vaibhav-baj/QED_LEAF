[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qed-leaf"
version = "0.1.0"
description = "Evidence-based Lean verification and immutable review reports"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
qed-leaf = "qed_leaf.cli:main"

[tool.setuptools.package-data]
qed_leaf = ["*.lean"]

[tool.setuptools.packages.find]
include = ["qed_leaf*"]
